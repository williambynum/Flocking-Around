[versions]
# Pinned to the exact toolchain already cached on this machine (matches Pixel9SensorScanner).
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
coroutines = "1.9.0"
exif = "1.3.7"
desugar = "2.1.2"

# ARCore. 1.48 is the last release verified against AGP 8.7 / compileSdk 35.
arcore = "1.48.0"

# ML Kit. object-detection provides the class-agnostic detector + tracker;
# object-detection-custom adds LocalModel (bring-your-own TFLite classifier).
mlkitObjectDetection = "17.0.2"
mlkitObjectDetectionCustom = "17.0.2"
# Separate API from object detection: ~400 generic labels (Television, Loudspeaker,
# Laptop, Printer...). On-device, no training, no network.
mlkitImageLabeling = "17.0.9"

# Optional cloud enrichment. Off by default; nothing leaves the device unless the
# operator turns it on and supplies their own API key.
anthropicJava = "2.54.0"
securityCrypto = "1.1.0-alpha06"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exif" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

arcore = { module = "com.google.ar:core", version.ref = "arcore" }
# Not "mlkit-object-detection": `object` is a Kotlin keyword, so the generated accessor
# libs.mlkit.object.detection fails to compile in a .kts build script.
mlkit-objectdetection = { module = "com.google.mlkit:object-detection", version.ref = "mlkitObjectDetection" }
mlkit-objectdetection-custom = { module = "com.google.mlkit:object-detection-custom", version.ref = "mlkitObjectDetectionCustom" }
mlkit-imagelabeling = { module = "com.google.mlkit:image-labeling", version.ref = "mlkitImageLabeling" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropicJava" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
